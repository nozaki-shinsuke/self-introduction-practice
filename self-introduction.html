<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介-野﨑</title>
</head>
<body>
    <h1>自己紹介</h1>
    <h2>プロフィール</h2>
    <p>名前：野﨑</p>
    <p>年齢：テスト</p>
    <p>出身地：テスト</p>
    <p>趣味：テスト</p>
    <h2>好きなもの</h2>
    <ul>
        <li>リンゴ</li>
        <li>みかん</li>
        <li>メロン</li>
    </ul>
    <h2>今年の目標</h2>
    <ol>
        <li>Laravelをマスターする</li>
        <li>毎日コードを書く</li>
        <li>ポートフォリオを作成する</li>
    </ol>
    <h2>リンク</h2>
    <a href="https://github.com/nozaki-shinsuke" target="_blank">mygitリンク</a>
    <h2>風景</h2>
    <img src="images/landscape.jpg" alt="好きな風景" width="400">
    <h2>お問い合わせ</h2>
    <form action="/submit" method="POST">
        <div>
            <label for="name">お名前:</label>
            <input type="text" id="name" name="username" required>
        </div>
        <div>
            <label for="name">お問い合わせ種別:</label>
            <select name="prefecture">
                <option value="">-- 選択してください --</option>
                <option value="option1">一般的なお問い合わせ</option>
                <option value="option2">ご意見・ご要望</option>
            </select>
        </div>
        <div>
            <label for="name">お問い合わせ内容:</label>
            <textarea name="message" rows="5" required></textarea>
        </div>
        <div>
            <input type="submit" value="送信する">
        </div>
    </form>
</body>
</html>
